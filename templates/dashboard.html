<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoniGan - Estado del animal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    h1 { color: #22c55e; margin: 0; }
    a {
      color: #94a3b8;
      text-decoration: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
    }
    .label { color: #94a3b8; font-size: 14px; }
    .value { font-size: 28px; font-weight: bold; margin-top: 8px; }
    .ok { color: #22c55e; }
    .alerta { color: #f87171; }
    .info {
      margin-top: 20px;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>MoniGan</h1>
    <a href="/logout">Cerrar sesión</a>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">Hora</div>
      <div class="value">{{ datos.hora }}</div>
    </div>
    <div class="card">
      <div class="label">Pulso</div>
      <div class="value">{{ datos.pulso }} bpm</div>
    </div>
    <div class="card">
      <div class="label">Movimiento</div>
      <div class="value">{{ datos.movimiento }}</div>
    </div>
    <div class="card">
      <div class="label">Batería</div>
      <div class="value">{{ datos.bateria }}</div>
    </div>
  </div>

  <div class="info">
    <div class="label">Estado del animal</div>
    <div class="value {% if datos.estado == 'Normal' %}ok{% else %}alerta{% endif %}">
      {{ datos.estado }}
    </div>
    <p>{{ datos.alerta }}</p>
    <p style="color:#94a3b8; font-size:13px;">
      Última actualización: {{ datos.ultima_actualizacion }}
    </p>
  </div>
</body>
</html>
