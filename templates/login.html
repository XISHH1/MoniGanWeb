<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoniGan - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      /* Fondo que simula el paisaje de la referencia con un overlay oscuro */
      background-image: linear-gradient(to right, rgba(15, 23, 42, 0.98) 25%, rgba(15, 23, 42, 0.7) 100%), url('https://images.unsplash.com/photo-1500595046743-cd271d694d30?q=80&w=2074&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="h-screen flex items-center justify-center font-sans text-slate-200">

  <div class="max-w-6xl w-full mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-12">
    
    <!-- Lado Izquierdo: Branding -->
    <div class="flex-1 space-y-6">
      <div class="flex items-center gap-3">
        <div class="relative text-[#22c55e]">
          <i class="fa-solid fa-wifi absolute -top-4 left-4 text-xl"></i>
          <i class="fa-solid fa-cow text-5xl"></i>
        </div>
      </div>
      <div>
        <h1 class="text-5xl font-bold text-white tracking-tight">Moni<span class="text-[#3b82f6]">Gan</span></h1>
        <p class="text-sm text-slate-400 mt-2 flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-[#22c55e]"></i>
          Monitoreo IoT de Animales - Santa María, Boyacá <i class="fa-solid fa-triangle-exclamation text-orange-500"></i>
        </p>
      </div>

      <div class="pt-6">
        <h2 class="text-3xl font-semibold text-white">Tecnología que cuida</h2>
        <h2 class="text-3xl font-bold text-[#22c55e]">lo que más importa</h2>
      </div>

      <div class="flex gap-6 pt-4 text-sm font-medium text-slate-300">
        <div class="flex items-center gap-2"><i class="fa-solid fa-shield-halved text-[#22c55e] text-lg"></i> Monitoreo en<br>tiempo real</div>
        <div class="flex items-center gap-2"><i class="fa-solid fa-tower-broadcast text-[#22c55e] text-lg"></i> Conectividad<br>IoT</div>
        <div class="flex items-center gap-2"><i class="fa-solid fa-leaf text-[#22c55e] text-lg"></i> Bienestar<br>animal</div>
      </div>
    </div>

    <!-- Lado Derecho: Formulario de Login -->
    <div class="w-full max-w-md">
      <div class="glass-panel p-10 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
          <div class="flex justify-center text-[#22c55e] mb-2">
            <i class="fa-solid fa-wifi relative -top-2 left-3 text-sm"></i>
            <i class="fa-solid fa-cow text-4xl"></i>
          </div>
          <h2 class="text-2xl font-bold text-white">Moni<span class="text-[#3b82f6]">Gan</span></h2>
          <p class="text-sm text-slate-400">Monitoreo de animales</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/50 text-red-500 text-sm p-3 rounded-lg text-center mb-6">
          <i class="fa-solid fa-circle-exclamation mr-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
          <div class="relative">
            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" name="username" placeholder="Usuario" required 
                   class="w-full bg-[#0f172a] border border-slate-700 rounded-xl py-3 pl-11 pr-4 text-white focus:outline-none focus:border-[#22c55e] transition-colors">
          </div>
          
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="password" name="password" placeholder="Contraseña" required 
                   class="w-full bg-[#0f172a] border border-slate-700 rounded-xl py-3 pl-11 pr-11 text-white focus:outline-none focus:border-[#22c55e] transition-colors">
            <i class="fa-regular fa-eye absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer hover:text-white"></i>
          </div>

          <button type="submit" class="w-full bg-[#22c55e] hover:bg-[#16a34a] text-white font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-green-500/20">
            Entrar <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
        
        <p class="text-center text-xs text-slate-500 mt-6 flex items-center justify-center gap-1">
          <i class="fa-solid fa-lock"></i> Acceso para usuarios autorizados
        </p>
      </div>
    </div>
  </div>

</body>
</html>
